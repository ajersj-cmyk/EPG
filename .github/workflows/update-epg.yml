name: Rebuild EPG

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC every day
  workflow_dispatch:        # allows "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build aliased US EPG
        run: python3 build_epg.py

      - name: Commit updated guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strong_us_sports_epg.xml.gz channel_aliases.txt
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "epg: daily rebuild $(date -u +%Y-%m-%d)"
          git push
