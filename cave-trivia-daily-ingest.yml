name: Cave Trivia daily question ingest

# Runs the human-written question pipeline every morning so the game's
# daily bank keeps growing without anyone touching it. Needs no secrets:
# qbreader, Wikimedia Commons, and Open Trivia DB are all keyless.
# Pushing the updated bank triggers cave-trivia-test.yml, which validates
# the banks and smoke-tests the server automatically.

on:
  schedule:
    # 10:00 UTC = 6:00 AM EDT — fresh questions before the day starts
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch daily questions
        working-directory: cave-trivia
        run: node scripts/fetch-daily.js >> data/ingest.log 2>&1 || true

      - name: Validate daily bank
        working-directory: cave-trivia
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const arr = JSON.parse(fs.readFileSync('data/questions-daily.json', 'utf8'));
          const ids = new Set();
          for (const q of arr) {
            if (!q.question || !Array.isArray(q.options) || q.options.length !== 4) throw new Error('bad question shape');
            if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer > 3) throw new Error('bad answer index');
            if (!q.id || ids.has(q.id)) throw new Error('duplicate/missing id');
            ids.add(q.id);
          }
          console.log('daily bank OK:', arr.length, 'questions');
          "

      - name: Commit updated bank
        run: |
          git config user.name "Cave Trivia Ingest"
          git config user.email "cave-trivia-ingest@local"
          git add cave-trivia/data/questions-daily.json
          if git diff --cached --quiet; then
            echo "no new questions today"
          else
            git commit -m "Daily question ingest $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
